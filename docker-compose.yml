name: bayanuk

x-php: &php
  image: bayanuk-api:dev
  environment:
    DB_HOST: postgres
    DB_PORT: "5432"
    REDIS_HOST: redis
    AWS_ENDPOINT: http://rustfs:9000
    CLAMAV_HOST: clamav
  volumes:
    - ./backend:/var/www/html
  restart: unless-stopped

services:
  api:
    <<: *php
    build:
      context: .
      target: development
    command: sh -c "[ -f vendor/autoload.php ] || composer install --no-interaction --prefer-dist; exec php-fpm"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 120s

    # Local only (--profile local). On the server the host nginx does this job.
  nginx:
    profiles: ["local"]
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:80"
    volumes:
      - ./backend:/var/www/html:ro
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  horizon:
    <<: *php
    pull_policy: never
    command: php artisan horizon
    depends_on:
      api:
        condition: service_healthy

  scheduler:
    <<: *php
    pull_policy: never
    command: php artisan schedule:work
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_DATABASE:-bayanuk}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in backend/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    configs:
      - source: postgres_init
        target: /docker-entrypoint-initdb.d/01-create-test-db.sh
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-5466}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in backend/.env}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in backend/.env}
    volumes:
      - rustfs-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9010:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rustfs-data:
  clamav-data:

configs:
  postgres_init:
    content: |
      #!/bin/sh
      set -e
      psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname postgres <<'SQL'
      SELECT 'CREATE DATABASE bayanuk_test' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'bayanuk_test')\gexec
      SQL
  
  nginx_conf:
    content: |
      server {
          listen 80;
          server_name _;
          root /var/www/html/public;
          index index.php;
          client_max_body_size 12m;

          location / {
              try_files $$uri $$uri/ /index.php?$$query_string;
          }

          location ~ \.php$$ {
              fastcgi_pass api:9000;
              fastcgi_param SCRIPT_FILENAME $$realpath_root$$fastcgi_script_name;
              fastcgi_read_timeout 120;
              include fastcgi_params;
          }

          location ~ /\.(?!well-known) {
              deny all;
          }
      }