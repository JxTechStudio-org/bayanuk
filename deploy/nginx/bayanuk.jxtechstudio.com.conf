# Host nginx site for bayanuk.jxtechstudio.com. Applied by hand by the server admin; the
# pipeline never touches host nginx.
#
#   /                       -> frontend container   127.0.0.1:8090 (HTTP)
#   /api/  /sanctum/  /up   -> PHP-FPM (api)        127.0.0.1:9110 (FastCGI)
#   anything else (/horizon, /storage, ...) is served by the frontend, which only has the SPA.
#
# The host has no copy of the PHP code: SCRIPT_FILENAME is the path inside the api container.
#
# Install:
#   1. sudo certbot certonly --nginx -d bayanuk.jxtechstudio.com
#   2. sudo htpasswd -c /etc/nginx/.htpasswd-bayanuk <user>        (apache2-utils; pre-launch only)
#   3. sudo cp bayanuk.jxtechstudio.com.conf /etc/nginx/sites-available/bayanuk.jxtechstudio.com
#      sudo ln -s /etc/nginx/sites-available/bayanuk.jxtechstudio.com /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name bayanuk.jxtechstudio.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    # No http2 on [::]:443: these listen options are shared by every IPv6 HTTPS site on the host,
    # and adding http2 here would turn it on for all of them.
    listen [::]:443 ssl;
    server_name bayanuk.jxtechstudio.com;

    ssl_certificate     /etc/letsencrypt/live/bayanuk.jxtechstudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bayanuk.jxtechstudio.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    # Uploads are limited to 10 MB by the app; 12m leaves room for the multipart overhead
    # (same as PHP's upload_max_filesize / post_max_size in the image).
    client_max_body_size 12m;

    # Headers for every response. They are set here only: an add_header inside a location
    # would drop all of these for that location.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # Enable after launch, once HTTPS is confirmed stable:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # ===================== PRE-LAUNCH: remove this section at launch =====================
    auth_basic           "Bayanuk (pre-launch)";
    auth_basic_user_file /etc/nginx/.htpasswd-bayanuk;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # =================== END PRE-LAUNCH (also remove the matching line below) ============

    # ========== CLOUDFLARE PROXY (orange cloud): uncomment only if the record is proxied ==========
    # With the record DNS-only (grey cloud, current setup), $remote_addr is already the
    # client IP; leave this commented out. If you switch to the orange cloud:
    #   - set Cloudflare SSL/TLS mode to Full (strict); the Certbot certificate stays valid;
    #   - uncomment these lines, so $remote_addr (sent to PHP as REMOTE_ADDR) is the visitor,
    #     not Cloudflare. The per-IP guest upload limit depends on it.
    #   - keep the list current: https://www.cloudflare.com/ips/
    # set_real_ip_from 173.245.48.0/20;
    # set_real_ip_from 103.21.244.0/22;
    # set_real_ip_from 103.22.200.0/22;
    # set_real_ip_from 103.31.4.0/22;
    # set_real_ip_from 141.101.64.0/18;
    # set_real_ip_from 108.162.192.0/18;
    # set_real_ip_from 190.93.240.0/20;
    # set_real_ip_from 188.114.96.0/20;
    # set_real_ip_from 197.234.240.0/22;
    # set_real_ip_from 198.41.128.0/17;
    # set_real_ip_from 162.158.0.0/15;
    # set_real_ip_from 104.16.0.0/13;
    # set_real_ip_from 104.24.0.0/14;
    # set_real_ip_from 172.64.0.0/13;
    # set_real_ip_from 131.0.72.0/22;
    # set_real_ip_from 2400:cb00::/32;
    # set_real_ip_from 2606:4700::/32;
    # set_real_ip_from 2803:f800::/32;
    # set_real_ip_from 2405:b500::/32;
    # set_real_ip_from 2405:8100::/32;
    # set_real_ip_from 2a06:98c0::/29;
    # set_real_ip_from 2c0f:f248::/32;
    # real_ip_header CF-Connecting-IP;
    # ================================ END CLOUDFLARE PROXY ================================

    # Laravel: API, Sanctum CSRF cookie, and the health check. Sent to PHP-FPM directly.
    location ~ ^/(api|sanctum)/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
        fastcgi_param HTTPS           on;
        # PRE-LAUNCH: do not pass the Basic Auth header on to the app. Remove at launch.
        fastcgi_param HTTP_AUTHORIZATION "";
        fastcgi_pass 127.0.0.1:9110;

        # PHP max_execution_time is 120s; nginx waits a little longer.
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout    125s;
        fastcgi_read_timeout    125s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location = /up {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
        fastcgi_param HTTPS           on;
        fastcgi_param HTTP_AUTHORIZATION "";
        fastcgi_pass 127.0.0.1:9110;
        fastcgi_read_timeout 10s;
    }

    # Frontend (React SPA served by the web container's nginx).
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization     "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
