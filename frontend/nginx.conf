server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # React Router: any page address (for example /d/123/result) gets index.html, and React shows the page.
    location / {
        try_files $uri /index.html;
    }

    # Vite adds a content hash to these file names, so a browser can keep them for a year.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html is checked again on every visit, so a new release shows at once.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
